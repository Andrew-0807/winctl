[package]
name = "winctl"
version = "2.0.2"
description = "Self-hosted Windows process/service manager with web UI"
authors = ["WinCTL"]
edition = "2021"

[lib]
name = "winctl_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "tokio", "cors"] }
dirs = "6"
winreg = "0.55"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_Security", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_JobObjects"] }
reqwest = { version = "0.12", features = ["json"] }
lazy_static = "1.5"
once_cell = "1.20"
chrono = "0.4"
futures = "0.3"
open = "5"
shell-words = "1"
dashmap = "5"
uuid = { version = "1", features = ["v4"] }
num_cpus = "1"
hostname = "0.4"
arboard = "0.1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
radix_fmt = "1.0"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
